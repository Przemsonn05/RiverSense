# Umieść w repozytorium jako: .github/workflows/collect.yml
# Uruchamia collect.py co godzinę na serwerach GitHuba i commituje nowe dane do repo.
name: collect-live-data

on:
  schedule:
    - cron: "7 * * * *"      # co godzinę, 7 min po pełnej (UTC); GitHub bywa opóźniony o kilka–kilkanaście min
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions (do testów)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python collect.py
      - name: Commit nowych danych
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "dane live $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
